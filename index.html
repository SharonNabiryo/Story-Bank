<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Story Bank: write STAR interview stories, see which skills they prove, prep for each interview, and practice out loud.">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Story Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: an app with a deep-navy "stage" and bright cue cards. Each STAR part owns a color
   (sky, mint, peach, highlighter) that follows it everywhere: badges, balance bars, guides, cue cards. */
:root {
  --bg: #F1F3F9;
  --surface: #FFFFFF;
  --raised: #FBFCFE;
  --ink: #18213D;
  --muted: #5B6383;
  --faint: #8C93AD;
  --line: #DCE1EE;
  --soft: #E8ECF5;
  --stage: #18213D;
  --stage-2: #263463;
  --stage-fg: #F4F6FC;
  --stage-muted: #B1BAD6;
  --S: #8CC4FF; --T: #8FE0BF; --A: #FFAE92; --R: #FFCD3C;
  --S-soft: #E4F0FF; --T-soft: #DEF6EC; --A-soft: #FFEBE3; --R-soft: #FFF5D1;
  --on-color: #18213D;
  --btn-bg: #18213D; --btn-fg: #FFFFFF;
  --focus: #3B5BDB;
  --good: #1A7F4F; --good-bg: #DFF4E8; --warn: #A3610B; --warn-bg: #FCEFD8; --bad: #B4302A; --bad-bg: #FBE3E1;
  --shadow: 0 1px 2px rgba(24,33,61,.05), 0 8px 24px rgba(24,33,61,.07);
  --shadow-lg: 0 2px 6px rgba(24,33,61,.06), 0 22px 56px rgba(24,33,61,.14);
  --scrim: rgba(12,16,32,.55);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1120; --surface: #151B2E; --raised: #192036; --ink: #E9EDF7; --muted: #A3ABC6; --faint: #6E7694; --line: #283049; --soft: #1D253D;
    --stage: #161E40; --stage-2: #253366; --stage-fg: #F4F6FC; --stage-muted: #B1BAD6;
    --S: #7DB6F5; --T: #79D3AE; --A: #F59E80; --R: #F2C230;
    --S-soft: #1A2A44; --T-soft: #17322A; --A-soft: #39251F; --R-soft: #383017;
    --on-color: #131830; --btn-bg: #E9EDF7; --btn-fg: #0D1120; --focus: #8DA6FF;
    --good: #63CF98; --good-bg: #163126; --warn: #E8AA55; --warn-bg: #352919; --bad: #F2887E; --bad-bg: #3B1F20;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 22px 56px rgba(0,0,0,.4);
    --scrim: rgba(3,5,12,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1120; --surface: #151B2E; --raised: #192036; --ink: #E9EDF7; --muted: #A3ABC6; --faint: #6E7694; --line: #283049; --soft: #1D253D;
  --stage: #161E40; --stage-2: #253366; --stage-fg: #F4F6FC; --stage-muted: #B1BAD6;
  --S: #7DB6F5; --T: #79D3AE; --A: #F59E80; --R: #F2C230;
  --S-soft: #1A2A44; --T-soft: #17322A; --A-soft: #39251F; --R-soft: #383017;
  --on-color: #131830; --btn-bg: #E9EDF7; --btn-fg: #0D1120; --focus: #8DA6FF;
  --good: #63CF98; --good-bg: #163126; --warn: #E8AA55; --warn-bg: #352919; --bad: #F2887E; --bad-bg: #3B1F20;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 22px 56px rgba(0,0,0,.4);
  --scrim: rgba(3,5,12,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
mark { background: linear-gradient(transparent 14%, var(--R) 14%, var(--R) 86%, transparent 86%); color: var(--on-color); padding: 0 .1em; border-radius: 2px; }
.blank { border: 1.5px dashed var(--warn); color: var(--warn); border-radius: 6px; padding: 0 5px; font-size: .92em; background: var(--warn-bg); }
h1, h2, h3, .h3 { font-family: var(--f-display); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
h2 { font-weight: 700; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.15; }
h3, .h3 { font-weight: 700; font-size: 17px; line-height: 1.25; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl { display: block; font-family: var(--f-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.lede { color: var(--muted); max-width: 64ch; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.view { animation: rise .35s cubic-bezier(.2,.7,.3,1) both; }
@keyframes rise { from { transform: translateY(8px); } to { transform: none; } }

/* App frame */
.app { max-width: 1200px; margin: 0 auto; padding-inline: 20px; padding-block: 16px 64px; }
@media (max-width: 520px) { .app { padding-inline: 16px; } }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; border: 0; background: none; cursor: pointer; padding: 0; }
.logo svg { flex: none; }
nav.tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
nav.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; transition: background .15s, color .15s; }
nav.tabs button:hover { color: var(--ink); background: var(--soft); }
nav.tabs button[aria-current="page"] { background: var(--btn-bg); color: var(--btn-fg); }
nav.tabs svg { width: 16px; height: 16px; flex: none; }
.tools { display: flex; align-items: center; gap: 10px; }
.status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.status.local i { background: var(--warn); }
.status.saving i { background: var(--focus); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.iconbtn:hover { color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
@media (max-width: 1060px) { nav.tabs button { padding: 8px 10px; } .status span { display: none; } }
@media (max-width: 780px) {
  .topbar nav.tabs { display: none; }
  nav.bottom { display: flex !important; }
  .app { padding-block-end: calc(100px + env(safe-area-inset-bottom, 0px)); }
}
nav.bottom { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
nav.bottom button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 12px; cursor: pointer; min-width: 0; }
nav.bottom button[aria-current="page"] { color: var(--ink); background: var(--soft); }
nav.bottom svg { width: 22px; height: 22px; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; padding: 10px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer; transition: transform .12s ease, box-shadow .15s ease, opacity .12s, background .15s; text-decoration: none; }
.btn:hover { box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn.bright { background: var(--R); color: var(--on-color); border-color: var(--R); box-shadow: 0 6px 20px color-mix(in srgb, var(--R) 35%, transparent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--soft); box-shadow: none; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn svg { width: 16px; height: 16px; flex: none; }
.ai { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; background: var(--R); color: var(--on-color); border-radius: 5px; padding: 1px 5px; }
input[type="text"], input[type="search"], input[type="date"], textarea, select { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px; padding: 10px 12px; outline: none; transition: border-color .12s, box-shadow .12s; }
input:focus, textarea:focus, select:focus { border-color: var(--focus); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 16%, transparent); }
textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--good); flex: none; margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { color: var(--ink); border-color: var(--faint); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.ex { border-style: dashed; color: var(--warn); border-color: var(--warn); background: transparent; }
.chip.draft { border-style: dashed; color: var(--focus); border-color: var(--focus); background: transparent; }
.state { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.state.good { color: var(--good); background: var(--good-bg); }
.state.warn { color: var(--warn); background: var(--warn-bg); }
.state.bad { color: var(--bad); background: var(--bad-bg); }
.state.info { color: var(--ink); background: var(--soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.meter { display: inline-flex; gap: 3px; align-items: center; }
.meter b { width: 12px; height: 6px; border-radius: 3px; background: var(--soft); display: block; }
.meter b.on { background: var(--faint); }
.meter.hi b.on { background: var(--good); }
.L { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--on-color); flex: none; background: var(--soft); }
.L.s { background: var(--S); } .L.t { background: var(--T); } .L.a { background: var(--A); } .L.r { background: var(--R); }
.balance { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--soft); gap: 2px; }
.balance i { display: block; min-width: 3px; }
.balance .s { background: var(--S); } .balance .t { background: var(--T); } .balance .a { background: var(--A); } .balance .r { background: var(--R); }

/* Stage (hero) */
.stage { background: var(--stage); color: var(--stage-fg); border-radius: 26px; padding: clamp(24px, 4vw, 44px); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: center; position: relative; overflow: hidden; isolation: isolate; }
.stage::before, .stage::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); z-index: -1; opacity: .5; }
.stage::before { width: 420px; height: 420px; right: -80px; top: -140px; background: radial-gradient(circle, var(--stage-2), transparent 70%); opacity: 1; }
.stage::after { width: 280px; height: 280px; right: 22%; bottom: -170px; background: radial-gradient(circle, color-mix(in srgb, var(--R) 45%, transparent), transparent 70%); opacity: .35; }
@media (max-width: 840px) { .stage { grid-template-columns: minmax(0, 1fr); } .stage .art { display: none; } }
.stage h1 { font-weight: 800; font-size: clamp(31px, 4.6vw, 52px); line-height: 1.02; letter-spacing: -.03em; }
.stage h1 mark { color: var(--on-color); }
.stage p { color: var(--stage-muted); font-size: 16.5px; max-width: 46ch; }
.stage .btn { border-color: transparent; }
.stage .btn.ghost { color: var(--stage-fg); border-color: rgba(255,255,255,.22); }
.stage .btn.ghost:hover { background: rgba(255,255,255,.08); }
.glass { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; }
.hero-boxes { display: flex; flex-wrap: wrap; gap: 10px; }
.readiness { display: flex; align-items: center; gap: 16px; padding: 14px 18px; color: inherit; text-align: left; cursor: pointer; transition: background .15s; }
.readiness:hover { background: rgba(255,255,255,.11); }
.ring { position: relative; width: 76px; height: 76px; flex: none; }
.ring svg, .tring svg, .mini-ring svg { transform: rotate(-90deg); display: block; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 21px; }
.stage .lbl { color: var(--stage-muted); margin: 0 0 2px; }
.readiness .next, .nextiv .next { font-weight: 600; font-size: 15px; }
.nextiv { padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; color: inherit; text-align: left; cursor: pointer; }
.nextiv:hover { background: rgba(255,255,255,.11); }
.nextiv .when { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--R); }
.breakdown { padding: 16px 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .breakdown { grid-template-columns: minmax(0, 1fr); } }
.breakdown .bar { background: rgba(255,255,255,.12); }
.breakdown .bar .fill { background: var(--R); }
.breakdown p { font-size: 13.5px; }
.art svg { width: 100%; height: auto; display: block; overflow: visible; }
.art .float { animation: float 6s ease-in-out infinite; }
.art .float.d2 { animation-delay: -2s; } .art .float.d3 { animation-delay: -4s; }
@keyframes float { 50% { transform: translateY(-7px); } }
@media (prefers-reduced-motion: reduce) { .art .float, .status.saving i, .loading::before, .view, .sheet, .cue-card { animation: none !important; } }

/* Home */
.home { display: flex; flex-direction: column; gap: 36px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.sec-head .lede { margin-top: 4px; }
.path { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 960px) { .path { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .path { grid-template-columns: minmax(0, 1fr); } }
.step { padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer; transition: transform .18s, box-shadow .18s; }
.step:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.step .num { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; min-height: 22px; }
.step .icon { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: var(--on-color); }
.step .icon svg { width: 24px; height: 24px; }
.step p { color: var(--muted); font-size: 14px; }
.step .go { font-weight: 700; font-size: 14px; margin-top: auto; }
.step.done { background: color-mix(in srgb, var(--good-bg) 55%, var(--surface)); }
.step.now { border: 1.5px solid var(--ink); box-shadow: var(--shadow); }
.tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--good); color: #fff; font-size: 13px; font-weight: 800; }
.explain { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); overflow: hidden; }
@media (max-width: 840px) { .explain { grid-template-columns: minmax(0, 1fr); } }
.explain .intro { padding: 26px; background: var(--soft); display: flex; flex-direction: column; gap: 10px; }
.explain .parts { padding: 8px 26px; }
.parts { display: flex; flex-direction: column; }
.part { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.part:first-child { border-top: 0; }
.part .L { width: 34px; height: 34px; font-size: 18px; }
.part b { display: block; }
.part .eg { font-size: 14px; color: var(--muted); margin-top: 3px; }

/* Split lists (stories, interviews) */
.split { display: grid; grid-template-columns: minmax(290px, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } .split.editing .lib { display: none; } .split:not(.editing) .edcol { display: none; } }
.lib { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lib-tools { display: flex; gap: 8px; }
.lib-tools input { flex: 1; min-width: 0; }
.tagbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.scard { text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: box-shadow .15s, border-color .15s, transform .15s; }
.scard:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.scard.sel { border-color: var(--ink); box-shadow: var(--shadow); }
.scard .t { font-weight: 700; font-size: 15.5px; line-height: 1.3; display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; }
.scard .pin { color: var(--warn); flex: none; }
.scard .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12.5px; color: var(--muted); }
.scard .res { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.scard .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.empty { padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.empty svg { width: 130px; height: auto; }

/* Editor */
.editor { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ed-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.seg { display: inline-flex; background: var(--soft); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.title-in { font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 2.4vw, 25px) !important; border: 0 !important; padding: 2px 0 6px !important; background: transparent !important; box-shadow: none !important; border-bottom: 2px dashed var(--line) !important; border-radius: 0 !important; }
.title-in:focus { border-bottom-color: var(--focus) !important; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: 1.3fr 1.3fr 1fr; gap: 12px; }
@media (max-width: 640px) { .two, .three { grid-template-columns: 1fr; } }
.ed-body { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: start; }
@media (max-width: 1100px) { .ed-body { grid-template-columns: minmax(0, 1fr); } }
.fields { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fld { border-radius: 14px; padding: 14px; background: var(--fill, var(--soft)); }
.fld.s { --fill: var(--S-soft); } .fld.t { --fill: var(--T-soft); } .fld.a { --fill: var(--A-soft); } .fld.r { --fill: var(--R-soft); }
.fld .fh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.fld .fh label { font-weight: 700; }

// ================= Storage: one private collection, items by id prefix =================
const store = {
  col: null,
  async init() {
    let db = null, user = null, id = null;
    try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch {}
    if (db && user) { try { id = await user.id(); } catch {} }

      try {

        S.mode = "db";
        this.col.onSnapshot(snap => { setDocs(snap.docs.map(d => ({ id: d.id, ...d.data() }))); }, () => { S.mode = "db-error"; renderStatus(); });

    if (!docs) { try { docs = JSON.parse(lsGet("storybank.v1") || "[]"); } catch { docs = []; } }
    setDocs(docs);
  },
  body(d) { const { id, _saved, ...rest } = d; return clone(rest); },
  persistLocal() { lsSet("storybank.v2", JSON.stringify(S.docs)); },
  async save(d) {

      catch (e) { toast(e?.code === "quota_exceeded" ? "Storage is full. Delete a few items and try again." : "Couldn't save. Check your connection, then edit again."); }

      const c = { id: d.id, ...this.body(d) };

  async remove(id) {

function saver(key) {

    schedule() { clearTimeout(timer); if (S[key]) S[key].updatedAt = Date.now(); timer = setTimeout(() => { timer = null; const d = S[key]; if (d) { d._saved = true; store.save(clone(d)); } }, 600); },
    flush() { if (!timer) return; clearTimeout(timer); timer = null; const d = S[key]; if (d) { d._saved = true; store.save(clone(d)); } },

}

// ================= Progress =================
function coverage() {
  const all = savedStories();
  return COMP.map(c => {
    const list = all.filter(s => (s.tags || []).includes(c.id));
    const best = list.reduce((m, s) => Math.max(m, analyze(s).score), 0);
    const state = list.length === 0 ? "bad" : (list.length >= 2 && best >= 4) || best === 5 ? "good" : "warn";
    return { ...c, list, best, state };
  });
}
function progress() {
  const all = savedStories(); const real = all.filter(s => !s.example);
  const cov = coverage();
  const parts = {
    cov: cov.reduce((m, c) => m + (c.state === "good" ? 1 : c.state === "warn" ? .5 : 0), 0) / COMP.length,
    str: all.length ? all.reduce((m, s) => m + analyze(s).score, 0) / all.length / 5 : 0,
    prac: all.length ? all.filter(s => (s.practice || []).length).length / all.length : 0,
  };
  const pct = Math.round((parts.cov * .5 + parts.str * .3 + parts.prac * .2) * 100);
  const ivs = S.interviews;
  const steps = [
    { id: "write", done: real.length >= 1, title: "Add your first story", body: "Write one with the step-by-step guide, or import drafts from your resume.", go: real.length ? "Add a story" : "Start writing", color: "var(--S)", icon: ICON.pen },
    { id: "strong", done: real.some(s => analyze(s).score >= 4), title: "Make it strong", body: "Aim for 4 of 5 checks. The checklist shows exactly what to fix.", go: "Strengthen a story", color: "var(--T)", icon: ICON.check },
    { id: "prep", done: ivs.some(i => (i.match?.questions || []).length) || lsGet("storybank.matched") === "1", title: "Prep for an interview", body: "Add a job posting to see likely questions and which story answers each.", go: "Add an interview", color: "var(--A)", icon: ICON.target },
    { id: "practice", done: all.some(s => (s.practice || []).length), title: "Practice out loud", body: "Answer a real question against the clock. Three times makes it natural.", go: "Practice now", color: "var(--R)", icon: ICON.practice },
  ];
  return { pct, parts, steps, next: steps.find(s => !s.done), cov, all, real };
}

function aiError(e) {
  if (e?.code === "not_granted") { S.sample = null; return "AI features are off for this page. You can turn them on from the page's permissions menu."; }
  if (e?.code === "rate_limited") return "Too many requests right now. Wait a minute, then try again.";
  if (e?.code === "invalid_json") return "The answer came back in an unexpected format. Try again.";
  return "Couldn't reach the AI. Check your connection and try again.";
}
async function runCoach() {
  const st = S.draft; if (!st || !S.sample) return;
  if (analyze(st).total < 25) { toast("Write a little more first, then ask for feedback"); return; }
  S.coach[st.id] = { busy: true }; renderCoach();
  $("#coach")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  const prompt = `You are a direct, encouraging coach for behavioral job interviews. The candidate is moving into product management.
Review this STAR story. Never invent facts, numbers, names or outcomes. Where a number is missing, write a placeholder like [add the result number].

Title: ${st.title || ""}
Role: ${st.role || ""}
Skills it should prove: ${(st.tags || []).map(t => CNAME[t]).join(", ") || "not chosen"}
Situation: ${st.s || ""}
Task: ${st.t || ""}
Action: ${st.a || ""}
Result: ${st.r || ""}

Reply with only JSON in exactly this shape:
{"verdict":"one plain, encouraging sentence on how interview-ready this is",
 "strengths":["up to 3 short points"],
 "fixes":[{"section":"S|T|A|R","issue":"short label","suggestion":"one concrete sentence"}],
 "followups":["2 or 3 probing follow-up questions an interviewer would likely ask"],
 "spoken":"the story rewritten as natural first-person speech, 160 to 260 words, short sentences, using only the facts given"}`;
  try {
    const r = await S.sample.json(prompt, { modelTier: "default" });
    if (!r || typeof r !== "object") throw { code: "invalid_json" };
    S.coach[st.id] = { result: {
      verdict: String(r.verdict || ""),
      strengths: Array.isArray(r.strengths) ? r.strengths.map(String).slice(0, 4) : [],
      fixes: Array.isArray(r.fixes) ? r.fixes.filter(f => f && typeof f === "object").slice(0, 5) : [],
      followups: Array.isArray(r.followups) ? r.followups.map(String).slice(0, 4) : [],
      spoken: String(r.spoken || ""),
    } };
  } catch (e) { S.coach[st.id] = { err: aiError(e) }; }
  if (S.draft?.id === st.id) { renderCoach(); renderSide(); }
}

function keywordDrafts(text) {
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  let role = ""; const out = [];
  for (const l of lines) {
    const isBullet = /^[-•*▪◦●·]\s*/.test(l) || (/^[A-Z][a-z]+ed\b|^(Led|Built|Ran|Managed|Created|Developed|Designed|Coordinated|Improved|Reduced|Increased)\b/.test(l) && l.length > 50);
    if (!isBullet) { if (l.length < 90) role = l; continue; }
    const b = l.replace(/^[-•*▪◦●·]\s*/, "");
    if (b.length < 35) continue;
    const low = b.toLowerCase();
    const tags = COMP.map(c => ({ id: c.id, n: c.kw.filter(k => low.includes(k)).length })).filter(x => x.n).sort((a, z) => z.n - a.n).slice(0, 2).map(x => x.id);
    out.push({ title: b.split(/\s+/).slice(0, 7).join(" ").replace(/[,.;:]$/, "").replace(/(\s+(in|for|to|and|of|with|the|a|an|on|across|that|through))+$/i, ""), role, when: "", tags,
      s: "[Where were you, and what problem or opportunity came up?]", t: "[What were you responsible for, and why did it matter?]",
      a: `I ${b.charAt(0).toLowerCase() + b.slice(1)} [Which steps did you take, and which decisions did you make?]`,
      r: /\d/.test(b) ? `[Describe the result: ${b.match(/[^.]*\d[^.]*/)?.[0]?.trim() || "add the number"}]` : "[What changed? Add a number.]" });
    if (out.length >= 8) break;
  }
  return out;
}
async function runImport() {
  const text = ($("#imp-text")?.value || "").trim(); S.imp.text = text; lsSet("storybank.resume", text);
  if (text.length < 120) { S.imp.err = "Paste more of your resume, including the bullet points under each job."; renderImport(); return; }
  S.imp.err = "";
  if (!S.sample) { const d = keywordDrafts(text); if (!d.length) { S.imp.err = "No bullet points found. Make sure each accomplishment is on its own line."; renderImport(); return; } S.imp.drafts = d; S.imp.picked = new Set(d.map((_, i) => i).slice(0, 4)); renderImport(); return; }
  S.imp.busy = true; renderImport();
  const prompt = `You help a job seeker turn their resume into STAR interview stories.
From the resume below, pick the 4 to 7 experiences that would make the strongest behavioral interview stories (ownership, problem solving, measurable impact, working with people).
For each, draft a STAR story using ONLY facts stated in the resume. Never invent numbers, names, tools, events or outcomes.
Wherever the resume does not say something, write a short, specific question in square brackets for the candidate to answer, for example [What error rate were you seeing before?]. Write in first person ("I ...").
Allowed skill ids: ${COMP.map(c => c.id).join(", ")}.

RESUME:
${text.slice(0, 12000)}

Reply with only a JSON array, each item shaped like:
{"title":"short headline of the story","role":"job title, company","when":"years if stated","tags":["1 to 3 skill ids"],"s":"situation","t":"task","a":"action, the longest part","r":"result"}`;
  try {
    const r = await S.sample.json(prompt, { modelTier: "default" });
    const arr = (Array.isArray(r) ? r : Array.isArray(r?.stories) ? r.stories : []).filter(d => d && d.title).slice(0, 8).map(d => ({
      title: String(d.title), role: String(d.role || ""), when: String(d.when || ""),

      s: String(d.s || ""), t: String(d.t || ""), a: String(d.a || ""), r: String(d.r || ""),
    }));
    if (!arr.length) throw { code: "invalid_json" };
    S.imp.drafts = arr; S.imp.picked = new Set(arr.map((_, i) => i));
  } catch (e) {
    if (e?.code === "not_granted") { S.sample = null; S.imp.drafts = keywordDrafts(text); S.imp.picked = new Set(S.imp.drafts.map((_, i) => i).slice(0, 4)); }
    else S.imp.err = aiError(e);

function matchPrompt(jd, all) {
  const lib = all.map(s => `- id: ${s.id} | ${s.title || "Untitled"} | skills: ${(s.tags || []).join(", ")} | ${[s.s, s.a, s.r].join(" ").slice(0, 420)}`).join("\n") || "(no stories yet)";
  return `You help a candidate prepare for a job interview using their own story bank.
Allowed competency ids: ${COMP.map(c => c.id).join(", ")}.

JOB POSTING:
${jd.slice(0, 9000)}

CANDIDATE STORIES:
${lib}

Reply with only JSON in this shape:
{"role":"short role name and company if stated",
 "themes":[{"competency":"id","evidence":"short paraphrase of what the posting says"}],
 "questions":[{"question":"a behavioral question this employer is likely to ask","competency":"id","storyId":"id of the best matching story, or null if none fits","angle":"one sentence on how to tell that story for this role, without inventing facts"}],
 "gaps":[{"competency":"id","advice":"one sentence on what kind of story to prepare"}]}
Give 3 to 6 themes and exactly 6 questions. Only use story ids from the list. Use null when no story fits rather than forcing a weak match.`;
}
function keywordMatch(jd) {
  const text = jd.toLowerCase();
  const scored = COMP.map(c => ({ c, n: c.kw.reduce((m, k) => m + (text.split(k).length - 1), 0) })).filter(x => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 6);
  const best = id => savedStories().filter(s => (s.tags || []).includes(id)).sort((a, b) => analyze(b).score - analyze(a).score)[0];
  return { ai: false, role: "", themes: scored.map(x => ({ competency: x.c.id })),
    questions: scored.map(x => ({ question: (QUESTIONS.find(q => q.c[0] === x.c.id) || QUESTIONS.find(q => q.c.includes(x.c.id))).q, competency: x.c.id, storyId: best(x.c.id)?.id || null, angle: "" })),
    gaps: scored.filter(x => !best(x.c.id)).map(x => ({ competency: x.c.id, advice: "The posting stresses this skill, and no story is tagged with it yet." })) };
}

  S.ivErr = "";
  const finish = m => { iv.match = m; iv.storyIds = [...new Set(m.questions.map(q => q.storyId).filter(Boolean))]; if (!iv.role && m.role) iv.role = m.role.split(/[,·|@]| at /)[0].trim(); ivSaver.schedule(); ivSaver.flush(); };
  if (!S.sample) { finish(keywordMatch(iv.jd)); renderIvDetail(); renderIvList(); return; }
  S.ivBusy = true; renderIvDetail();
  const all = savedStories();
  try {
    const r = await S.sample.json(matchPrompt(iv.jd, all), { modelTier: "default" });
    const ids = new Set(all.map(s => s.id)); const okC = c => (CNAME[c] ? c : "");
    const m = { ai: true, role: String(r?.role || ""),
      themes: (Array.isArray(r?.themes) ? r.themes : []).filter(t => okC(t?.competency)).slice(0, 6),
      questions: (Array.isArray(r?.questions) ? r.questions : []).filter(q => q && q.question).slice(0, 8).map(q => ({ question: String(q.question), competency: okC(q.competency), storyId: ids.has(q.storyId) ? q.storyId : null, angle: String(q.angle || "") })),
      gaps: (Array.isArray(r?.gaps) ? r.gaps : []).filter(g => okC(g?.competency)).slice(0, 5) };
    if (!m.questions.length) throw { code: "invalid_json" };
    if (S.iv?.id === iv.id) finish(m);
  } catch (e) {
    if (e?.code === "not_granted") { S.sample = null; if (S.iv?.id === iv.id) finish(keywordMatch(iv.jd)); }
    else S.ivErr = aiError(e);

  S.ivBusy = false; renderIvDetail(); renderIvList();

  iv.debrief = iv.debrief || { asked: [] }; iv.debrief.asked = [...(iv.debrief.asked || []), { q, storyId }];
  ivSaver.schedule(); ivSaver.flush();
  if (!S.settings.customQ.some(x => x.q.toLowerCase() === q.toLowerCase())) { S.settings.customQ = [...S.settings.customQ, { q, from: iv.company || "" }].slice(-200); saveSettings(); }
  S.debriefQ = ""; S.debriefStory = ""; renderIvDetail();
  setTimeout(() => $("#dq")?.focus(), 20);
  toast("Added. It's now in your practice questions too.");
}

// ================= Cue cards =================
function openCue(ids, label) {
  flushAll();
  const list = ids.map(id => savedStories().find(s => s.id === id)).filter(Boolean);
  if (!list.length) { toast("Add a story first"); return; }
  S.cue = { ids: list.map(s => s.id), i: 0, label }; renderCue();
}
function renderCue() {
  const o = $("#overlay"); const c = S.cue;
  if (!c) { o.innerHTML = ""; document.body.classList.remove("locked"); return; }
  document.body.classList.add("locked");
  const st = savedStories().find(s => s.id === c.ids[c.i]);
  if (!st) { S.cue = null; return renderCue(); }
  const beats = sentences(st.a).slice(0, 3).map(x => x.length > 150 ? x.slice(0, 147).replace(/\s\S*$/, "") + "..." : x);
  const hook = sentences(st.s)[0] || st.s;
  o.innerHTML = `<div class="overlay cue" role="dialog" aria-modal="true" aria-label="Cue cards">
    <div class="cue-top"><span class="lbl" style="margin:0;color:var(--stage-muted)">${esc(c.label)} · ${c.i + 1} of ${c.ids.length}</span><button class="btn ghost small" data-act="cueclose">Done ✕</button></div>
    <article class="cue-card" id="cuecard">
      <div class="stack" style="gap:8px"><div class="row">${(st.tags || []).map(t => `<span class="chip">${esc(CNAME[t])}</span>`).join("")}</div><h2>${esc(st.title || "Untitled story")}</h2>${st.role ? `<span class="note">${esc([st.role, st.when].filter(Boolean).join(" · "))}</span>` : ""}</div>
      <div class="cue-row"><span class="L s">S</span><div class="txt">${rich(hook)}</div></div>
      ${st.t ? `<div class="cue-row"><span class="L t">T</span><div class="txt">${rich(sentences(st.t)[0] || st.t)}</div></div>` : ""}
      <div class="cue-row"><span class="L a">A</span><ol class="beats">${beats.map(b => `<li><span>${rich(b)}</span></li>`).join("") || "<li>Add your actions</li>"}</ol></div>
      <div class="cue-row"><span class="L r">R</span><div class="txt" style="font-weight:600">${rich(st.r, true) || "Add your result"}</div></div>
    </article>
    <div class="cue-nav"><button class="btn" data-act="cueprev" ${c.i === 0 ? "disabled" : ""}>&larr; Prev</button><div class="cue-dots" aria-hidden="true">${c.ids.map((_, i) => `<i class="${i === c.i ? "on" : ""}"></i>`).join("")}</div><button class="btn" data-act="cuenext" ${c.i === c.ids.length - 1 ? "disabled" : ""}>Next &rarr;</button></div>
  </div>`;
  const card = $("#cuecard"); let x0 = null;
  card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) cueGo(dx < 0 ? 1 : -1); });
}
function cueGo(d) { const c = S.cue; if (!c) return; const n = c.i + d; if (n < 0 || n >= c.ids.length) return; c.i = n; renderCue(); }

// ================= Coverage =================
function viewCoverage() {
  const cov = coverage();
  const n = st => cov.filter(c => c.state === st).length;
  const label = { good: "Ready", warn: "Thin", bad: "Missing" };
  return `<div class="sec-head"><div><h2>Which skills can you prove?</h2><p class="lede">Interviewers test the same skills again and again. A skill is ready when you have two stories for it, or one story that passes every check.</p></div>
      <div class="cov-sum"><span class="pill"><b style="color:var(--good)">${n("good")}</b> Ready</span><span class="pill"><b style="color:var(--warn)">${n("warn")}</b> Thin</span><span class="pill"><b style="color:var(--bad)">${n("bad")}</b> Missing</span></div></div>
    <div class="grid">${cov.map(c => {
      const q = QUESTIONS.find(x => x.c.includes(c.id));
      return `<button class="card tile ${c.state}" data-cov="${c.id}">
        <span class="tr"><span class="h3">${esc(c.name)}</span><span class="state ${c.state}">${label[c.state]}</span></span>
        <span class="tr"><span class="dots" aria-hidden="true">${[0, 1, 2].map(i => `<i class="${i < c.list.length ? "on" : ""}"></i>`).join("")}</span><span class="mono note">${c.list.length} ${c.list.length === 1 ? "story" : "stories"}</span></span>
        <span class="sub">${c.list.length ? esc(c.list.slice(0, 2).map(s => s.title || "Untitled").join(" · ")) : "Typical question: " + esc(q?.q || "")}</span>
        <span class="act">${c.list.length ? "See stories" : "Write one now"} &rarr;</span>
      </button>`;
    }).join("")}</div>`;
}

// ================= Practice =================
const allQuestions = () => [...QUESTIONS, ...S.settings.customQ.map(x => ({ q: x.q, c: [], from: x.from || "an interview" }))];
const pracQuestions = () => S.prac.filter === "mine" ? allQuestions().filter(q => q.from) : S.prac.filter ? QUESTIONS.filter(q => q.c.includes(S.prac.filter)) : allQuestions();
const currentQ = () => { const l = pracQuestions(); return l.length ? l[S.prac.qIndex % l.length] : QUESTIONS[0]; };
const pracElapsed = () => (S.prac.elapsed + (S.prac.running ? Date.now() - S.prac.start : 0)) / 1000;
function pracTarget() { const st = stories().find(s => s.id === S.prac.storyId); return st ? Math.max(60, analyze(st).secs) : 120; }
function viewPractice() {
  const q = currentQ(); const all = savedStories();
  const fits = all.filter(s => (s.tags || []).some(t => q.c.includes(t))).sort((a, b) => analyze(b).score - analyze(a).score);
  if (!S.prac.storyId && fits[0]) S.prac.storyId = fits[0].id;
  const st = all.find(s => s.id === S.prac.storyId);
  const done = S.prac.elapsed && !S.prac.running;
  const log = all.flatMap(s => (s.practice || []).map(p => ({ ...p, title: s.title || "Untitled story" }))).sort((a, b) => b.at - a.at).slice(0, 8);
  const mine = S.settings.customQ.length;
  return `<div class="prac">
    <section class="qstage">
      <div class="row between">
        <select id="pfilter" aria-label="Practice a skill" style="width:auto;max-width:100%"><option value="">All questions</option>${mine ? `<option value="mine" ${S.prac.filter === "mine" ? "selected" : ""}>Asked in my interviews (${mine})</option>` : ""}${COMP.map(c => `<option value="${c.id}" ${S.prac.filter === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        <button class="btn ghost small" data-act="nextq">New question &rarr;</button>
      </div>
      <div><span class="lbl">The interviewer asks</span><div class="qtext">${esc(q.q)}</div></div>
      <div class="row">${q.from ? `<span class="chip">Asked at ${esc(q.from)}</span>` : q.c.map(c => `<span class="chip">${esc(CNAME[c])}</span>`).join("")}</div>
      <div><label class="lbl" for="pstory">Story you'll tell</label>
        <select id="pstory"><option value="">${all.length ? "Choose a story" : "Add a story first"}</option>${all.map(s => `<option value="${s.id}" ${S.prac.storyId === s.id ? "selected" : ""}>${esc(s.title || "Untitled story")}${fits.includes(s) ? " (good fit)" : ""}</option>`).join("")}</select></div>
      <div class="timer-wrap">
        <div class="tring" id="tring">${ring(0, 120, 10)}<span class="tv" id="timer">0:00</span></div>
        <div class="stack" style="gap:8px">
          <span class="lbl" style="margin:0">Target ${fmtTime(pracTarget())}. Answer out loud.</span>
          <div class="row"><button class="btn bright" data-act="timer">${S.prac.running ? "Stop" : S.prac.elapsed ? "Resume" : "Start answering"}</button>${done ? `<button class="btn ghost small" data-act="resettimer">Reset</button>` : ""}</div>
        </div>
      </div>
      ${done ? `<div><span class="lbl">How confident did that feel?</span><div class="row"><div class="rate" role="group" aria-label="Confidence from 1 to 5">${[1, 2, 3, 4, 5].map(n => `<button data-rate="${n}" class="${S.prac.rating === n ? "on" : ""}" aria-pressed="${S.prac.rating === n}">${n}</button>`).join("")}</div><button class="btn" data-act="logprac" ${!S.prac.storyId || !S.prac.rating ? "disabled" : ""}>Save this practice</button></div></div>` : ""}
      ${S.sample && st ? `<div class="stack" style="gap:8px"><button class="btn ghost small" data-act="followup" style="align-self:flex-start;border-color:rgba(255,255,255,.22)" ${S.prac.fuBusy ? "disabled" : ""}><span class="ai">AI</span> Ask me a follow-up</button>${S.prac.fuBusy ? `<div class="loading" style="color:var(--stage-muted)">Thinking like the interviewer</div>` : S.prac.followup ? `<div class="followup">${esc(S.prac.followup)}</div>` : ""}</div>` : ""}
      ${st ? `<details><summary>Peek at your story</summary><div class="spoken" style="margin-top:8px">${esc(storyText(st))}</div></details>` : ""}
    </section>
    <div class="stack" style="gap:16px">
      <div class="card tips"><h3>How to practice</h3><ol><li>Pick a story that fits the question.</li><li>Press start and answer out loud, as if to a real interviewer.</li><li>Stop, rate how it felt, and save it.</li><li>Repeat until it feels natural, usually about three times.</li></ol></div>
      <div class="card log"><h3>Recent practice</h3>${log.length ? `<ul>${log.map(p => `<li><span><b>${esc(p.title)}</b><br><span class="muted">${esc(p.q || "")}</span></span><span class="mono muted" style="text-align:right">${fmtTime(p.secs)}<br>${"●".repeat(p.rating)}${"○".repeat(5 - p.rating)}</span></li>`).join("")}</ul>` : `<p class="note">Your practice sessions will show up here.</p>`}</div>
    </div>
  </div>`;
}
let timerInt = null;
function tickTimer() {
  const el = $("#timer"); const tr = $("#tring"); if (!el || !tr) return;
  const secs = pracElapsed(), target = pracTarget();
  el.textContent = fmtTime(secs);
  const svg = tr.querySelector("svg"); if (svg) svg.outerHTML = ring(secs / target * 100, 120, 10, "rgba(255,255,255,.14)", secs > target * 1.25 ? "var(--A)" : "var(--R)");
}
function toggleTimer() {
  if (S.prac.running) { S.prac.elapsed += Date.now() - S.prac.start; S.prac.running = false; clearInterval(timerInt); }
  else { S.prac.start = Date.now(); S.prac.running = true; S.prac.rating = 0; clearInterval(timerInt); timerInt = setInterval(tickTimer, 250); }
  render();
}
async function logPractice() {
  const st = stories().find(s => s.id === S.prac.storyId); if (!st || !S.prac.rating) return;
  const entry = { at: Date.now(), secs: Math.round(S.prac.elapsed / 1000), rating: S.prac.rating, q: currentQ().q };
  const first = !savedStories().some(s => (s.practice || []).length);
  const updated = { ...clone(st), practice: [...(st.practice || []), entry].slice(-30), updatedAt: Date.now() };
  if (S.draft?.id === st.id) S.draft.practice = updated.practice;
  await store.save(updated);
  S.prac.elapsed = 0; S.prac.rating = 0; S.prac.followup = null;
  toast("Practice saved. Nice work."); if (first) celebrate(); render();
}
async function runFollowup() {
  const st = stories().find(s => s.id === S.prac.storyId); if (!st || !S.sample) return;
  S.prac.fuBusy = true; render();
  try {
    const r = await S.sample(`You are a sharp but fair interviewer for a product role. The candidate was asked: "${currentQ().q}" and answered with this story:\n\n${storyText(st)}\n\nAsk ONE probing follow-up question that tests whether they really drove the outcome, how they made decisions, or what they would do differently. Reply with only the question.`, { modelTier: "quick", cache: false });
    S.prac.followup = String(r.text || "").trim();
  } catch (e) { S.prac.followup = aiError(e); }
  S.prac.fuBusy = false; render();
}

// ================= Events =================
function armDelete(t) {
  S.armedDelete = true; t.classList.add("armed"); t.textContent = "Confirm delete";
  setTimeout(() => { if (S.armedDelete) { S.armedDelete = false; const b = document.querySelector(".btn.danger.armed"); if (b) { b.classList.remove("armed"); b.textContent = "Delete"; } } }, 4000);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-act='impclose-bg']"); if (!t) return;
  const d = t.dataset;
  if (d.act === "impclose-bg") { if (e.target === t && !S.imp?.busy) { S.imp = null; renderImport(); } return; }
  if (d.tab) return setView(d.tab);
  if (d.step) return goStep(d.step);
  if (d.open) { if (S.cue) { S.cue = null; renderCue(); } return openStory(d.open); }
  if (d.openiv) return openInterview(d.openiv);
  if (d.filter !== undefined) { S.filterTag = d.filter || null; renderLibrary(); return; }
  if (d.mode) { storySaver.flush(); S.edMode = d.mode; S.edStep = 0; renderEditor(); return; }
  if (d.gostep) return gotoStep(+d.gostep);
  if (d.tag && S.draft) {
    const tags = new Set(S.draft.tags || []); tags.has(d.tag) ? tags.delete(d.tag) : tags.add(d.tag);
    S.draft.tags = COMP.map(c => c.id).filter(id => tags.has(id));
    t.classList.toggle("on"); t.setAttribute("aria-pressed", tags.has(d.tag));
    storySaver.schedule(); renderLibrary(); return;
  }
  if (d.cov) { const c = coverage().find(x => x.id === d.cov); if (c.list.length) { S.filterTag = c.id; setView("stories"); } else newStory({ tags: [c.id] }); return; }
  if (d.rate) { S.prac.rating = +d.rate; render(); return; }
  if (d.ivrate && S.iv) { S.iv.debrief = { ...(S.iv.debrief || {}), rating: +d.ivrate }; ivSaver.schedule(); renderIvDetail(); return; }
  if (d.delq !== undefined && S.iv) { S.iv.debrief.asked = S.iv.debrief.asked.filter((_, i) => i !== +d.delq); ivSaver.schedule(); renderIvDetail(); return; }
  switch (d.act) {
    case "theme": S.theme = S.theme === "system" ? "light" : S.theme === "light" ? "dark" : "system"; lsSet("storybank.theme", S.theme); applyTheme(); toast(`Theme: ${S.theme === "system" ? "matches your device" : S.theme}`); break;
    case "breakdown": S.showBreak = !S.showBreak; render(); break;
    case "new": newStory(); break;
    case "newfor": newStory({ tags: d.comp ? [d.comp] : [] }); break;
    case "examples": loadExamples(); break;
    case "clearex": stories().filter(s => s.example).forEach(s => store.remove(s.id)); if (S.draft?.example) { S.draft = null; renderEditor(); } toast("Example stories removed"); break;
    case "close": storySaver.flush(); S.draft = null; S.armedDelete = false; renderLibrary(); renderEditor(); break;
    case "pin": if (S.draft) { S.draft.pinned = !S.draft.pinned; storySaver.schedule(); renderEditor(); renderLibrary(); } break;
    case "copy": if (S.draft) copyText(storyText(S.draft)); break;
    case "copyall": copyText(stories().map(storyText).join("\n\n----------\n\n")); break;
    case "copyspoken": { const c = S.coach[S.draft?.id]; if (c?.result?.spoken) copyText(c.result.spoken); break; }
    case "coach": runCoach(); break;
    case "gnext": gotoStep(S.edStep + 1); break;
    case "gprev": gotoStep(S.edStep - 1); break;
    case "gdone": { storySaver.schedule(); storySaver.flush(); S.edMode = "full"; const sc = analyze(S.draft).score; renderEditor(); toast(sc >= 4 ? "Story saved and ready" : "Story saved. Use the checklist to strengthen it."); if (sc >= 4) celebrate(); break; }
    case "delete":
      if (!S.armedDelete) armDelete(t);
      else { const id = S.draft.id; const saved = S.stories.some(s => s.id === id); storySaver.cancel(); S.draft = null; S.armedDelete = false; if (saved) store.remove(id); else onData(); renderEditor(); toast("Story deleted"); }
      break;
    case "import": openImport(); break;
    case "impclose": S.imp = null; renderImport(); break;
    case "imprun": runImport(); break;
    case "impback": S.imp.drafts = null; renderImport(); break;
    case "impadd": addImported(); break;
    case "newiv": newInterview(); break;
    case "closeiv": ivSaver.flush(); S.iv = null; S.armedDelete = false; renderIvList(); renderIvDetail(); break;
    case "deliv":
      if (!S.armedDelete) armDelete(t);
      else { const id = S.iv.id; const saved = S.interviews.some(s => s.id === id); ivSaver.cancel(); S.iv = null; S.armedDelete = false; if (saved) store.remove(id); else onData(); renderIvDetail(); toast("Interview deleted"); }
      break;
    case "matchiv": runIvMatch(); break;
    case "addq": addDebriefQ(); break;
    case "cueiv": openCue(S.iv.storyIds || [], `${S.iv.company || "Interview"} stories`); break;
    case "cueall": { const list = savedStories(); const pinned = list.filter(s => s.pinned); openCue((pinned.length ? pinned : list).map(s => s.id), pinned.length ? "Pinned stories" : "All stories"); break; }
    case "cueclose": S.cue = null; renderCue(); break;
    case "cueprev": cueGo(-1); break;
    case "cuenext": cueGo(1); break;
    case "nextq": S.prac.qIndex++; S.prac.followup = null; S.prac.storyId = ""; S.prac.elapsed = 0; S.prac.running = false; clearInterval(timerInt); render(); break;
    case "timer": toggleTimer(); break;
    case "resettimer": S.prac.elapsed = 0; S.prac.rating = 0; render(); break;
    case "logprac": logPractice(); break;
    case "followup": runFollowup(); break;
  }
});
document.addEventListener("input", e => {
  const el = e.target; const d = el.dataset;
  if (el.id === "search") { S.search = el.value; renderLibrary(); return; }
  if (el.id === "imp-text" && S.imp) { S.imp.text = el.value; return; }
  if (el.id === "dq") { S.debriefQ = el.value; return; }
  if (d.field && S.draft) {
    S.draft[d.field] = el.value; storySaver.schedule(); renderSide();
    const card = document.querySelector(`.scard[data-open="${S.draft.id}"]`);
    if (card) card.outerHTML = cardHtml(S.draft); else renderLibrary();
    return;
  }
  if ((d.ivfield || d.ivdeb) && S.iv) {
    if (d.ivfield) S.iv[d.ivfield] = el.value; else S.iv.debrief = { ...(S.iv.debrief || {}), [d.ivdeb]: el.value };
    ivSaver.schedule();
    if (["company", "role", "date", "stage", "outcome"].includes(d.ivfield || d.ivdeb) || d.ivfield === "myQuestions" || d.ivfield === "jd") {
      const card = document.querySelector(`.icard[data-openiv="${S.iv.id}"]`);
      if (!card || d.ivfield === "date") renderIvList(); else renderIvList();
      if (d.ivfield === "date" || d.ivfield === "myQuestions" || d.ivfield === "jd") { const h = document.querySelector(".countdown"); if (h) h.textContent = whenText(S.iv.date); updateChecklist(); }
    }
  }
});
function updateChecklist() {
  const p = ivPrep(S.iv); const ul = document.querySelector(".checklist"); if (!ul) return;
  ul.querySelectorAll("li").forEach((li, i) => { const it = p.items[i]; li.classList.toggle("ok", it.ok); const dot = li.querySelector(".dot"); if (dot) dot.textContent = it.ok ? "✓" : ""; });
  const st = ul.parentElement.querySelector(".state"); if (st) { st.textContent = `${p.done}/${p.total}`; st.className = "state " + (p.done === p.total ? "good" : "info"); }
  const n = document.querySelector(".ivhead .note"); if (n) n.textContent = `${p.done} of ${p.total} prep steps done`;
}
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "pfilter") { S.prac.filter = el.value; S.prac.qIndex = 0; S.prac.storyId = ""; S.prac.followup = null; render(); }
  if (el.id === "pstory") { S.prac.storyId = el.value; S.prac.followup = null; render(); }
  if (el.id === "dqs") S.debriefStory = el.value;
  if (el.dataset.pick !== undefined && S.imp) { const i = +el.dataset.pick; el.checked ? S.imp.picked.add(i) : S.imp.picked.delete(i); renderImport(); }
  if (el.dataset.ivcheck && S.iv) { S.iv.checks = { ...(S.iv.checks || {}), [el.dataset.ivcheck]: el.checked }; ivSaver.schedule(); updateChecklist(); renderIvList(); }
  if ((el.dataset.ivfield === "stage" || el.dataset.ivfield === "date" || el.dataset.ivdeb === "outcome") && S.iv) renderIvList();
});
document.addEventListener("keydown", e => {
  if (S.cue) { if (e.key === "ArrowRight") cueGo(1); else if (e.key === "ArrowLeft") cueGo(-1); else if (e.key === "Escape") { S.cue = null; renderCue(); } return; }
  if (S.imp && e.key === "Escape" && !S.imp.busy) { S.imp = null; renderImport(); return; }
  if (e.key === "Enter" && e.target.id === "dq") { e.preventDefault(); addDebriefQ(); return; }
  if (e.key === "Escape" && S.armedDelete) { S.armedDelete = false; S.view === "stories" ? renderEditor() : renderIvDetail(); }
});
window.addEventListener("pagehide", flushAll);

// ================= Boot =================
applyTheme(); render(); renderStatus(); store.init();
(async () => { try { const s = await window.claude?.use?.("sample"); if (s) { S.sample = s; if (S.view === "stories") renderSide(); else if (S.view === "interviews") renderIvDetail(); else render(); if (S.imp && !S.imp.busy) renderImport(); } } catch {} })();
})();
</script>
